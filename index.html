<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault | Unified Command</title>
    <script src="https://unpkg.com/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;700&display=swap');
        :root { --neon-blue: #00f2ff; }
        body { background: #010409; color: #e6edf3; font-family: 'Inter', sans-serif; overflow: hidden; background-image: linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px); background-size: 30px 30px; }
        .glass-panel { background: rgba(13, 17, 23, 0.8); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .cyber-header { font-family: 'Space Grotesk', sans-serif; text-transform: uppercase; letter-spacing: 0.2em; }
        .nav-btn.active { background: #2563eb; color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .radar-line { transform-origin: 50px 50px; animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .log-text { font-family: 'Space Mono', monospace; font-size: 10px; color: #10b981; }
        .user-id-tag { font-size: 7px; background: rgba(255,255,255,0.05); padding: 1px 4px; border-radius: 4px; color: #8b949e; border: 1px solid rgba(255,255,255,0.1); font-family: 'Space Mono', monospace; }
        input::placeholder { color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:8080' : window.location.origin;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [isLocked, setIsLocked] = useState(true);
            const [user, setUser] = useState(null);
            const [activePage, setActivePage] = useState('vault');
            
            const [notes, setNotes] = useState([]);
            const [files, setFiles] = useState([]);
            const [messages, setMessages] = useState([]);
            const [allUsers, setAllUsers] = useState([]);
            const [socketStatus, setSocketStatus] = useState('offline');
            const [showFileSelector, setShowFileSelector] = useState(false);
            
            const [noteInput, setNoteInput] = useState({ title: '', content: '' });
            const [chatInput, setChatInput] = useState('');
            const [scanProgress, setScanProgress] = useState(0);

            const socketRef = useRef(null);
            const chatEndRef = useRef(null);

            const ROOT_EMAIL = 'shiveksingh43@gmail.com';
            const isAdmin = user?.email === ROOT_EMAIL;

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const token = params.get('token') || localStorage.getItem('token');
                if (token && token !== "null") {
                    localStorage.setItem('token', token);
                    window.history.replaceState({}, document.title, "/");
                    setIsLoggedIn(true);
                    handleInit(token);
                }
            }, []);

            const initSocket = (token) => {
                if (!socketRef.current && window.io) {
                    socketRef.current = io(API_BASE, { 
                        auth: { token },
                        transports: ['polling', 'websocket'],
                        secure: true,
                        reconnection: true
                    });

                    socketRef.current.on('connect', () => setSocketStatus('online'));
                    socketRef.current.on('receive_message', (msg) => setMessages(prev => [...prev, msg]));
                    
                    // CRITICAL: Auto-refresh when admin approves
                    socketRef.current.on('identity_approved', () => {
                        console.log("Access Granted. Force Refreshing...");
                        window.location.reload();
                    });

                    socketRef.current.on('user_blocked', () => { 
                        localStorage.clear(); 
                        window.location.href='/'; 
                    });
                }
            }

            const handleInit = async (token) => {
                const pulseUrl = `${API_BASE}/api/users/profile?pulse=${Date.now()}`;
                const headers = { 
                    'Authorization': `Bearer ${token}` ,
                    'Cache-Control': 'no-cache ,no-store, must-revalidate',
                };
                try {
                    const profRes = await fetch(pulseUrl, { headers });
                    
                    const prof = await profRes.json();
                    const currentStatus = String(prof.status || "").toLowerCase().trim();
                    const currentEmail = String(prof.email || "").toLowerCase().trim();
                    const adminEmail = String(ROOT_EMAIL || "").toLowerCase().trim();
                    console.log("NEURAL_SYNC_STATUS:", currentStatus);

                    // FIXED GATEKEEPER LOGIC
                    

                    if (currentEmail === adminEmail || currentStatus === 'approved') {
                        console.log("ACCESS_GRANTED: Initializing Vault UI...");
                        setUser(prof);
                        setActivePage('vault'); 
                        const [nts, fls] = await Promise.all([
                            fetch(`${API_BASE}/api/notes?pulse=${Date.now()}`, { headers }).then(r => r.json()),
                            fetch(`${API_BASE}/api/files?pulse=${Date.now()}`, { headers }).then(r => r.json())
                        ]);
                        setNotes(nts.data || []);
                        setFiles(fls.data || []);

                        if (currentEmail === adminEmail) {
                            const usersRes = await fetch(`${API_BASE}/api/admin/users`, { headers }).then(r => r.json());
                            setAllUsers(usersRes.data || []);
                        }
                    } else {
                        console.log("ACCESS_DENIED: User is still Quarantined.");
                        setUser(prof);
                        setActivePage('quarantine');
                    }

                    initSocket(token);
                } catch (e) { 
                    console.error("Identity_Sync_Crash", e);
                }
            };

            const handleUserAction = async (userId, action) => {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_BASE}/api/admin/users/${userId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });
                if (res.ok) handleInit(token);
            };

            const sendSignal = (fileAsset = null) => {
                if (!socketRef.current) return;
                let payload = chatInput;
                if (fileAsset) {
                    payload = `[SECURE_FILE]: ${fileAsset.fileName}\n${window.location.origin}/api/files/download/${fileAsset._id}?token=${localStorage.getItem('token')}`;
                }
                if (!payload.trim()) return;
                
                socketRef.current.emit('send_message', { 
                    message: payload, text: payload, 
                    senderName: user?.name, senderEmail: user?.email 
                });
                setChatInput('');
                setShowFileSelector(false);
            };

            const deleteNote = async (id) => {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_BASE}/api/notes/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) handleInit(token);
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const token = localStorage.getItem('token');
                const formData = new FormData();
                formData.append('file', file);
                const res = await fetch(`${API_BASE}/api/files/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                if (res.ok) handleInit(token);
            };

            useEffect(() => {
                if (isLoggedIn && isLocked) {
                    const i = setInterval(() => setScanProgress(p => p >= 100 ? 100 : p + 4), 30);
                    setTimeout(() => setIsLocked(false), 1200);
                    return () => clearInterval(i);
                }
            }, [isLoggedIn, isLocked]);

            useEffect(() => { if(activePage === 'comms') chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, activePage]);

            if (!isLoggedIn) return (
                <div className="h-screen flex items-center justify-center bg-black">
                    <div className="glass-panel p-12 rounded-[3.5rem] text-center space-y-10 border-cyan-500/20 max-w-sm slide-up">
                        <i className="fa-solid fa-fingerprint text-7xl text-cyan-400"></i>
                        <h1 className="cyber-header text-xl font-bold text-cyan-400 tracking-widest">SecureVault</h1>
                        <button onClick={() => window.location.href=`${API_BASE}/api/auth/google`} className="w-full bg-cyan-600 border border-cyan-400 text-white py-4 rounded-2xl font-bold hover:bg-cyan-400 hover:text-black transition-all">INITIALIZE_HANDSHAKE</button>
                    </div>
                </div>
            );

            if (activePage === 'quarantine') return (
                <div className="h-screen flex items-center justify-center bg-black text-center p-10">
                    <div className="glass-panel p-16 rounded-[4rem] border-yellow-500/20 max-w-xl slide-up">
                        <i className="fa-solid fa-id-card-clip text-6xl text-cyan-400 mb-8 animate-pulse"></i>
                        <h2 className="cyber-header text-xl text-cyan-400 mb-4">Identity Sync Pending</h2>
                        <p className="text-gray-500 text-sm leading-relaxed mb-10 font-mono">NODE_HASH: {user?.email}<br/>STATUS: QUARANTINE_PROTOCOL_07</p>
                        
                        <div className="flex flex-col gap-4">
                            <button 
                                onClick={async () => {
                                    const token = localStorage.getItem('token');
                                    const res = await fetch(`${API_BASE}/api/users/profile?pulse=${Date.now()}`, { headers: { 'Authorization': `Bearer ${token}` } });
                                    const data = await res.json();
                                    const cleanStatus = String(data.status || "").toLowerCase().trim();
                                    if (cleanStatus === 'approved') {
                                        console.log("MATCH_FOUND: Forcing Portal Entry...");
                                        window.location.reload(); 
                                    } else {
                                        alert("QUARANTINE_STILL_ACTIVE: Server reports status as '" + data.status + "'");
                                    }
                                }} 
                                className="w-full bg-cyan-600/20 border border-cyan-500 text-cyan-300 py-3 rounded-2xl text-[10px] font-bold hover:bg-cyan-500 hover:text-black transition-all uppercase"
                            >
                                PROBE WHITELIST STATUS
                            </button>
                            <button onClick={() => {localStorage.clear(); window.location.href='/'}} className="text-[9px] font-bold text-slate-600 hover:text-white uppercase tracking-widest underline">Terminate Session</button>
                        </div>
                    </div>
                </div>
            );

            if (isLocked) return (
                <div className="h-screen flex flex-col items-center justify-center bg-black text-cyan-400">
                    <div className="w-80 space-y-4">
                        <div className="flex justify-between cyber-header text-[10px] font-bold"><span>NEURAL_SCAN</span><span>{scanProgress}%</span></div>
                        <div className="h-1 bg-gray-900 rounded-full overflow-hidden border border-cyan-500/20"><div className="h-full bg-cyan-400 shadow-[0_0_15px_cyan]" style={{width: `${scanProgress}%`}}></div></div>
                    </div>
                </div>
            );

            return (
                <div className="h-screen flex flex-col w-full overflow-hidden slide-up">
                    <nav className="p-6 flex justify-between items-center border-b border-white/5 bg-black/40 glass-panel">
                        <div className="flex space-x-2">
                            {['vault', 'comms', 'drive', 'pulse', 'admin'].map(t => (
                                (t === 'admin' && !isAdmin) ? null :
                                <button key={t} onClick={() => setActivePage(t)} className={`px-5 py-2 rounded-xl text-[10px] cyber-header font-bold transition-all ${activePage === t ? 'active' : 'text-slate-500 hover:text-white'}`}>{t}</button>
                            ))}
                        </div>
                        <div className="flex items-center gap-6">
                            {isAdmin && <span className="bg-red-600 text-[7px] px-2 py-0.5 rounded font-black">ROOT_ADMIN</span>}
                            <span className="text-[10px] font-bold text-cyan-400 uppercase tracking-widest">{user?.name}</span>
                            <button onClick={() => {localStorage.clear(); window.location.href='/'}} className="text-red-500/50 hover:text-red-500 transition-colors"><i className="fa-solid fa-power-off"></i></button>
                        </div>
                    </nav>

                    <main className="flex-grow p-10 overflow-y-auto relative">
                        {activePage === 'vault' && (
                            <div className="space-y-8 max-w-4xl mx-auto slide-up">
                                <div className="glass-panel p-8 rounded-3xl space-y-4 border-cyan-500/10">
                                    <input value={noteInput.title} onChange={e => setNoteInput({...noteInput, title: e.target.value})} className="w-full bg-white/5 border border-white/5 p-4 rounded-2xl outline-none text-sm" placeholder="Intel Label" />
                                    <textarea value={noteInput.content} onChange={e => setNoteInput({...noteInput, content: e.target.value})} className="w-full bg-white/5 border border-white/5 p-4 rounded-2xl outline-none h-32 text-sm" placeholder="Payload..." />
                                    <button onClick={async () => {
                                        const res = await fetch(`${API_BASE}/api/notes`, { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}`, 'Content-Type': 'application/json' }, body: JSON.stringify(noteInput) });
                                        if (res.ok) { setNoteInput({title:'', content:''}); handleInit(localStorage.getItem('token')); }
                                    }} className="w-full bg-blue-600 py-4 rounded-2xl font-bold text-[10px] cyber-header">COMMIT_TO_VAULT</button>
                                </div>
                                <div className="grid gap-4">
                                    {notes.map(n => (
                                        <div key={n._id} className="glass-panel p-5 rounded-2xl flex justify-between items-center border-l-4 border-cyan-500/30 group">
                                            <div><h4 className="font-bold text-cyan-100 uppercase text-xs">{n.title}</h4><p className="text-xs text-gray-500">{n.content}</p></div>
                                            <button onClick={() => deleteNote(n._id)} className="opacity-0 group-hover:opacity-100 transition-opacity text-gray-600 hover:text-red-500 p-2"><i className="fa-solid fa-trash-can"></i></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activePage === 'admin' && isAdmin && (
                            <div className="space-y-12 max-w-5xl mx-auto slide-up">
                                <section className="glass-panel p-8 rounded-3xl border-emerald-500/20 mb-10">
                                    <h3 className="cyber-header text-[10px] text-emerald-400 mb-6 font-bold flex items-center gap-2">
                                        <i className="fa-solid fa-user-plus"></i> AUTHORIZED_NEURAL_UPLINK
                                    </h3>
                                    <div className="flex gap-4">
                                        <input 
                                            id="whitelistEmailInput"
                                            type="email" 
                                            placeholder="operator@gmail.com" 
                                            className="flex-grow bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-xs font-mono text-emerald-400 focus:border-emerald-500/50 transition-all"
                                        />
                                        <button 
                                            onClick={async () => {
                                                const email = document.getElementById('whitelistEmailInput').value;
                                                if(!email) return;
                                                const res = await fetch(`${API_BASE}/api/admin/whitelist`, {
                                                    method: 'POST',
                                                    headers: { 
                                                        'Authorization': `Bearer ${localStorage.getItem('token')}`,
                                                        'Content-Type': 'application/json' 
                                                    },
                                                    body: JSON.stringify({ email })
                                                });
                                                if(res.ok) {
                                                    document.getElementById('whitelistEmailInput').value = '';
                                                    handleInit(localStorage.getItem('token')); 
                                                }
                                            }}
                                            className="bg-emerald-600 px-10 rounded-2xl font-bold text-[10px] cyber-header hover:bg-emerald-400 hover:text-black transition-all"
                                        >
                                            ADD_TO_WHITELIST
                                        </button>
                                    </div>
                                </section>

                                <section>
                                    <h2 className="cyber-header text-[10px] text-cyan-400 mb-6 font-bold">Whitelisted Operators</h2>
                                    <div className="grid gap-4">
                                        {allUsers.filter(u => u.status === 'approved' && u.email !== ROOT_EMAIL).map(u => (
                                            <div key={u._id} className="glass-panel p-6 rounded-3xl flex justify-between items-center border-l-2 border-emerald-500">
                                                <div><p className="font-bold text-sm">{u.name}</p><p className="text-[10px] text-gray-500 font-mono">{u.email}</p></div>
                                                <button onClick={() => handleUserAction(u._id, 'remove')} className="px-5 py-2 bg-red-600/20 text-red-500 rounded-xl text-[9px] font-bold uppercase hover:bg-red-600 hover:text-white transition-all">Revoke Access</button>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </div>
                        )}

                        {activePage === 'comms' && (
                            <div className="h-full flex flex-col max-w-5xl mx-auto glass-panel rounded-[3rem] overflow-hidden shadow-2xl border border-white/5 slide-up">
                                <header className="p-6 bg-white/5 border-b border-white/5 flex justify-between items-center text-cyan-400">
                                    <h2 className="cyber-header text-sm font-bold flex items-center gap-3"><span className={`w-2 h-2 rounded-full ${socketStatus === 'online' ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`}></span>COMMS_LINK</h2>
                                    <span className="text-[8px] font-bold uppercase">{socketStatus}</span>
                                </header>
                                <div className="flex-grow overflow-y-auto p-8 space-y-6">
                                    {messages.map((m, i) => (
                                        <div key={i} className={`flex flex-col ${m.senderEmail === user?.email ? 'items-end' : 'items-start'} slide-up`}>
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="text-[8px] font-black uppercase text-gray-500">{m.senderName}</span>
                                                <span className="user-id-tag">{m.senderEmail}</span>
                                            </div>
                                            <div className={`max-w-[70%] p-4 rounded-2xl text-xs leading-relaxed ${m.senderEmail === user?.email ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/40' : 'bg-white/5 border border-white/5 text-gray-300'}`}>
                                                {m.message || m.text}
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={chatEndRef} />
                                </div>
                                <div className="p-6 bg-black/40 border-t border-white/5 relative">
                                    {showFileSelector && (
                                        <div className="absolute bottom-full left-6 right-6 glass-panel p-4 rounded-t-2xl border-b-0 space-y-2 max-h-40 overflow-y-auto slide-up">
                                            {files.map(f => (
                                                <div key={f._id} onClick={() => sendSignal(f)} className="p-2 hover:bg-blue-600 rounded-lg cursor-pointer text-[10px] flex justify-between">
                                                    <span>{f.fileName}</span><i className="fa-solid fa-share-nodes"></i>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    <div className="flex items-center space-x-4 bg-white/5 border border-white/5 p-4 rounded-3xl">
                                        <button onClick={() => setShowFileSelector(!showFileSelector)} className={`${showFileSelector ? 'text-cyan-400' : 'text-gray-500'} hover:text-white transition-all`}><i className="fa-solid fa-paperclip text-lg"></i></button>
                                        <input value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyPress={e => e.key === 'Enter' && sendSignal()} className="flex-grow bg-transparent outline-none text-[12px]" placeholder="Type signal..." />
                                        <button onClick={() => sendSignal()} className="text-cyan-400 hover:scale-110 transition-transform"><i className="fa-solid fa-paper-plane text-lg"></i></button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activePage === 'drive' && (
                            <div className="space-y-8 slide-up">
                                <div className="flex justify-between items-center">
                                    <h2 className="cyber-header text-sm font-bold text-cyan-400">Secure_Cloud_Drive</h2>
                                    <label className="bg-cyan-500 text-black px-8 py-2 rounded-xl text-[10px] font-bold cyber-header cursor-pointer hover:bg-cyan-400">
                                        UPLOAD_OBJECT <input type="file" className="hidden" onChange={handleFileUpload} />
                                    </label>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                    {files.map(f => (
                                        <div key={f._id} className="glass-panel p-6 rounded-3xl text-center group hover:border-cyan-500/30 transition-all">
                                            <i className="fa-solid fa-file-shield text-4xl text-cyan-400/30 mb-6 group-hover:text-cyan-400 transition-all"></i>
                                            <p className="text-[10px] font-bold truncate w-full mb-6 uppercase tracking-widest">{f.fileName}</p>
                                            <button onClick={() => window.open(`${API_BASE}/api/files/download/${f._id}?token=${localStorage.getItem('token')}`)} className="w-full bg-white/5 py-2 rounded-xl text-[9px] font-bold hover:bg-blue-600 transition-colors">DECRYPT</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        
                        {activePage === 'pulse' && (
                            <div className="h-full flex flex-col items-center justify-center space-y-12 slide-up">
                                <div className="w-64 h-64 relative opacity-60">
                                    <svg viewBox="0 0 100 100" className="w-full h-full">
                                        <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(0, 242, 255, 0.1)" strokeWidth="0.5" />
                                        <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(0, 242, 255, 0.1)" strokeWidth="0.5" />
                                        <g className="radar-line"><line x1="50" y1="50" x2="50" y2="5" stroke="var(--neon-blue)" strokeWidth="1" opacity="0.5" /></g>
                                    </svg>
                                    <div className="absolute inset-0 flex flex-col items-center justify-center text-[10px] cyber-header text-cyan-400 animate-pulse">Scanning</div>
                                </div>
                                <div className="w-full max-w-2xl glass-panel p-6 rounded-xl relative">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="cyber-header text-[10px] text-cyan-400">Live_Network_Pulse</h3>
                                        <span className="text-[8px] text-slate-500 font-mono">Node: {user?.email}</span>
                                    </div>
                                    <div className="space-y-2">
                                        <p className="log-text uppercase"> [RBAC] Enforcement Active: Protocol 07</p>
                                        <p className="log-text uppercase"> [INFO] Whitelist Status: {isAdmin ? 'ROOT_OVERRIDE' : user?.status === 'approved' ? 'VERIFIED' : 'PENDING'}</p>
                                        <p className="log-text uppercase"> [AUTH] Handshake: Google_Cloud_OAuth_v2</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
